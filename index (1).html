<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatLine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#d5dbe5;--acc:#2f5bff;--hit:#1a9d63;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#16203a;--ink:#e8edf7;--mut:#9aa6bd;--line:#26324f;--acc:#7a98ff;--hit:#3ecf8e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#16203a;--ink:#e8edf7;--mut:#9aa6bd;--line:#26324f;--acc:#7a98ff;--hit:#3ecf8e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
h1{font-size:48px;line-height:1}
h3{font-size:24px;margin:20px 0 4px}
.st{font-size:28px;margin:26px 0 8px}
.lede,.sub,.empty{color:var(--mut)}
.lede{margin:6px 0 4px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bd{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);font:700 15px "Barlow Condensed","Arial Narrow",sans-serif;font-style:normal;letter-spacing:.02em}
.bd.big{width:60px;height:60px;border-radius:14px;font-size:22px}
.card{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tm{display:flex;align-items:center;gap:10px}
.tm b{font-weight:500}
.tm small{color:var(--mut);font-size:13px}
.tt{grid-column:2;grid-row:1/3;color:var(--mut);font-size:14px;text-align:right}
.back{background:none;border:0;color:var(--acc);padding:4px 0;margin-bottom:12px}
.stripe{height:6px;border-radius:3px;margin-bottom:16px}
.vs{display:flex;align-items:center;gap:12px}
.vs span{color:var(--mut)}
.names{margin:10px 0 2px;font:700 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.chips{display:flex;flex-direction:column;gap:6px;margin:8px 0 18px}
.chip{border-left:4px solid;padding:7px 10px;background:var(--card);border-radius:0 8px 8px 0;font-size:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 6px}
.seg button{flex:1;padding:10px;background:var(--card);border:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--bg);font-weight:500}
.rk{display:grid;grid-template-columns:1fr 80px 68px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rk span{display:block;color:var(--mut);font-size:14px}
.rk b{font-weight:500}
.rk em,.kv em{font-style:normal;text-align:right}
.rk em{font-weight:700;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mut)}
.soft .bar i{background:var(--hit)}.soft em{color:var(--hit)}
.kv{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.kv em{color:var(--mut)}
.th{display:flex;align-items:center;gap:10px;margin:20px 0 4px}
.th h3{margin:0}
.note{margin-top:32px;font-size:13px;color:var(--mut)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div id="home">
<h1>StatLine</h1>
<p class="lede" id="lede">Loading this week’s NFL matchups…</p>
<div id="list"></div>
</div>
<div id="detail" hidden></div>
<p class="note">Team badges use team colors and abbreviations, not official logos. Stats from the free nflverse project. Stats only, not betting advice. Sports betting is legal only in some states, and age rules vary. Problem gambling help: 1-800-GAMBLER.</p>
</main>
<script>
const N={ARI:"Arizona Cardinals",ATL:"Atlanta Falcons",BAL:"Baltimore Ravens",BUF:"Buffalo Bills",CAR:"Carolina Panthers",CHI:"Chicago Bears",CIN:"Cincinnati Bengals",CLE:"Cleveland Browns",DAL:"Dallas Cowboys",DEN:"Denver Broncos",DET:"Detroit Lions",GB:"Green Bay Packers",HOU:"Houston Texans",IND:"Indianapolis Colts",JAX:"Jacksonville Jaguars",KC:"Kansas City Chiefs",LA:"Los Angeles Rams",LAC:"Los Angeles Chargers",LV:"Las Vegas Raiders",MIA:"Miami Dolphins",MIN:"Minnesota Vikings",NE:"New England Patriots",NO:"New Orleans Saints",NYG:"New York Giants",NYJ:"New York Jets",PHI:"Philadelphia Eagles",PIT:"Pittsburgh Steelers",SEA:"Seattle Seahawks",SF:"San Francisco 49ers",TB:"Tampa Bay Buccaneers",TEN:"Tennessee Titans",WAS:"Washington Commanders"};
const C={ARI:"97233F",ATL:"A71930",BAL:"241773",BUF:"00338D",CAR:"0085CA",CHI:"0B162A",CIN:"FB4F14",CLE:"311D00",DAL:"003594",DEN:"FB4F14",DET:"0076B6",GB:"203731",HOU:"03202F",IND:"002C5F",JAX:"006778",KC:"E31837",LA:"003594",LAC:"0080C6",LV:"000000",MIA:"008E97",MIN:"4F2683",NE:"002244",NO:"9F8958",NYG:"0B2265",NYJ:"125740",PHI:"004C54",PIT:"FFB612",SEA:"002244",SF:"AA0000",TB:"D50A0A",TEN:"4B92DB",WAS:"5A1414"};
const DAYS=["Thursday","Friday","Saturday","Sunday","Monday","Tuesday","Wednesday"];
const nm=t=>N[t]||t;
const col=t=>"#"+(C[t]||"5b6678");
const ink=h=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return(.299*r+.587*g+.114*b)>160?"#111":"#fff"};
const badge=(t,big)=>`<span class="bd${big?" big":""}" style="background:${col(t)};color:${ink(col(t))}">${t}</span>`;
const $=id=>document.getElementById(id);
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const day=g=>(g.when||"").split(" ")[0];
const tm=g=>{const m=(g.when||"").split(" ")[1];if(!m||!m.includes(":"))return"";const[h,mi]=m.split(":").map(Number);return`${h%12||12}:${String(mi).padStart(2,"0")} ${h<12?"AM":"PM"} ET`};
let G=[],cur=null,tab="def";

fetch("data/nfl.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  G=d.games||[];
  const when=d.updated?new Date(d.updated).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"";
  $("lede").textContent=G.length?`NFL week ${d.week}. Updated ${when}.`:"No upcoming games found in the data yet.";
  list();
}).catch(()=>{$("lede").textContent="Couldn’t load the data file. Check that data/nfl.json exists in the repository."});

function card([g,i]){
  return`<button class="card" data-g="${i}"><div class="tm">${badge(g.away)}<b>${nm(g.away)}</b></div><div class="tm">${badge(g.home)}<small>at</small><b>${nm(g.home)}</b></div><span class="tt">${tm(g)}</span></button>`;
}
function list(){
  const all=G.map((g,i)=>[g,i]);
  const byTime=(a,b)=>(a[0].when>b[0].when?1:-1);
  let h="";
  DAYS.forEach(d=>{const gs=all.filter(x=>day(x[0])==d).sort(byTime);if(gs.length)h+=`<h2 class="st">${d}</h2>`+gs.map(card).join("")});
  const rest=all.filter(x=>!DAYS.includes(day(x[0])));
  if(rest.length)h+=`<h2 class="st">Games</h2>`+rest.map(card).join("");
  $("list").innerHTML=h;
}

function draw(){
  const g=cur,T=k=>nm(g[k]);
  const chips=[];
  ["away","home"].forEach(k=>(g.defense[k]||[]).forEach(([l,v,r])=>{if(r<=8)chips.push([r,k,l])}));
  chips.sort((a,b)=>a[0]-b[0]);
  const chipHtml=chips.length?`<h3>Soft spots</h3><p class="sub">Where a defense ranks in the top 8 for most allowed.</p><div class="chips">${chips.slice(0,6).map(([r,k,l])=>`<div class="chip" style="border-color:${col(g[k])}"><b>${g[k]}</b> defense allows the ${ord(r)} most: ${l.replace(" allowed","")}</div>`).join("")}</div>`:"";
  const head=t=>`<div class="th">${badge(t)}<h3>${nm(t)}</h3></div>`;
  const df=k=>head(g[k])+((g.defense[k]||[]).map(([l,v,r])=>`<div class="rk${r<=8?" soft":""}"><div><span>${l}</span><b>${v}</b></div><div class="bar"><i style="width:${(33-r)/32*100}%"></i></div><em>${ord(r)} most</em></div>`).join("")||`<p class="empty">No ranking data yet.</p>`);
  const inj=k=>head(g[k])+((g.injuries[k]||[]).map(([n,p,s,d])=>`<div class="kv"><span><b>${n}</b>, ${p}</span><em>${s}, ${d}</em></div>`).join("")||`<p class="empty">No Out, Doubtful, or Questionable players listed.</p>`);
  const hs=k=>head(g[k])+((g.history[k]||[]).map(([n,c,s])=>`<div class="kv"><span><b>${n}</b>, ${c}</span><em>${s}</em></div>`).join("")||`<p class="empty">No history against this opponent.</p>`);
  const sr=g.series||{meetings:[]};
  const body={
    def:`<p class="sub">Per game this season, ranked among 32 teams. Green means one of the 8 that allow the most.</p>${df("home")}${df("away")}`,
    inj:`<p class="sub">Players listed Out, Doubtful, or Questionable.</p>${inj("away")}${inj("home")}`,
    hist:`<h3>Past meetings</h3><p class="sub">${sr.summary||""}</p>${(sr.meetings||[]).map(([w,r])=>`<div class="kv"><span><b>${w}</b></span><em>${r}</em></div>`).join("")}<h3>Player history in this matchup</h3>${hs("away")}${hs("home")}`
  }[tab];
  const tabs=[["def","Defenses"],["inj","Injuries"],["hist","History"]].map(([k,l])=>`<button data-t="${k}" aria-pressed="${k==tab}">${l}</button>`).join("");
  $("detail").innerHTML=`<button class="back" data-back>Back to matchups</button>
  <div class="stripe" style="background:linear-gradient(90deg,${col(g.away)} 50%,${col(g.home)} 50%)"></div>
  <div class="vs">${badge(g.away,1)}<span>at</span>${badge(g.home,1)}</div>
  <div class="names">${T("away")} at ${T("home")}</div><p class="sub">${g.when?day(g)+" "+tm(g):""}</p>
  ${chipHtml}<div class="seg" role="group" aria-label="Section">${tabs}</div>${body}`;
}
$("list").onclick=e=>{const b=e.target.closest("[data-g]");if(b){cur=G[+b.dataset.g];tab="def";draw();$("home").hidden=true;$("detail").hidden=false;window.scrollTo(0,0)}};
$("detail").onclick=e=>{
  if(e.target.closest("[data-back]")){$("detail").hidden=true;$("home").hidden=false;return}
  const t=e.target.closest("[data-t]");if(t){tab=t.dataset.t;draw()}
};
</script>
</body>
</html>
